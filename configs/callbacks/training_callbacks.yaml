# Training callbacks configuration
checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  monitor: val_accuracy
  mode: max
  save_top_k: 1
  filename: ram-{epoch:02d}-{val_accuracy:.3f}

early_stopping:
  _target_: pytorch_lightning.callbacks.EarlyStopping
  monitor: val_accuracy
  mode: max
  patience: 10
  verbose: true 